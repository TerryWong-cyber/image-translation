[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "image-translation"
version = "0.1.0"
description = "Image OCR and translation service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<5",
    "paddleocr>=2.7,<4",
    "pillow>=10,<13",
    "requests>=2.31,<3",
    "scikit-learn>=1.3,<2",
    "uvicorn[standard]>=0.27,<1",
    "werkzeug>=3,<4",
]

[project.optional-dependencies]
# PaddlePaddle GPU packages depend on the server's CUDA version and should be
# installed separately from the matching PaddlePaddle package index.
cpu = [
    "paddlepaddle>=2.6,<4",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
