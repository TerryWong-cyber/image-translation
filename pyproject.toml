[project]
name = "image-translation"
version = "0.1.0"
description = "Image OCR and translation service"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "mcp>=2.0,<3",
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<4.12",
    "pillow>=10,<13",
    "pydantic>=2.12,<3",
    "requests>=2.31,<3",
    "scikit-learn>=1.3,<2",
    "uvicorn[standard]>=0.27,<1",
    "werkzeug>=3,<4",
]


[project.optional-dependencies]

cpu = [
    "paddlepaddle>=2.6,<3",
    "paddleocr>=2.7,<3",
]

gpu = [
    "paddleocr>=2.7,<3",
]


dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["unit_tests", "integration", "integration_tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
